name: Build Focus Timer APK

on:
  workflow_dispatch:
  push:
    branches: [ focus-timer ]
    paths:
      - 'FocusTimerAndroid/**'
      - '.github/workflows/build-focus-timer.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: FocusTimerAndroid
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp FocusTimerAndroid/app/build/outputs/apk/debug/app-debug.apk FocusTimer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusTimer-APK
          path: FocusTimer.apk
          retention-days: 30
